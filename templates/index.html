<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FNCADnet</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fonts/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=20260714-neural">
    <style>
      /* ─── 디자인 시스템 토큰 (FNCADnet — monochrome: 흑/백/짙은 네이비) ─── */
      :root {
        --c-navy: #0a1228;          /* 아주 짙은 네이비 */
        --c-navy-light: #1a2548;    /* 동일계열, 호버용 */
        --c-bg: #ffffff;
        --c-surface: #ffffff;
        --c-surface-soft: #fafbfc;
        --c-border: #e2e8f0;
        --c-border-strong: #cbd5e1;
        --c-text: #000000;
        --c-text-secondary: #0a1228;
        --c-muted: #6b7280;
        --c-accent: #0a1228;
        --c-accent-hover: #000000;
        --c-accent-soft: #ffffff;
        --c-violet: #0a1228;
        --c-cyan: #0a1228;
        --c-emerald: #0a1228;
        --c-amber: #0a1228;
        --c-rose: #000000;

        --grad-brand: var(--c-navy);
        --grad-soft-bg: #ffffff;

        /* 각진 직사각형 — 모든 radius 0 (border 는 얇은 슬레이트로 부드럽게) */
        --r-sm: 0;
        --r-md: 0;
        --r-lg: 0;
        --r-xl: 0;

        /* shadow — 원복, 색상은 무채색이라 그대로 유지 가능 */
        --sh-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
        --sh-md: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
        --sh-lg: 0 4px 12px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
        --sh-xl: 0 12px 32px -6px rgba(15, 23, 42, 0.10), 0 4px 12px -2px rgba(15, 23, 42, 0.05);
        --sh-glow: 0 4px 24px -4px rgba(10, 18, 40, 0.22);

        --tr-fast: 120ms cubic-bezier(0.4, 0, 0.2, 1);
        --tr: 180ms cubic-bezier(0.4, 0, 0.2, 1);

        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
      }

      html, body {
        font-family: var(--font-sans) !important;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        color: var(--c-text);
        background: var(--c-bg);
        letter-spacing: -0.005em;
      }

      /* ─── 헤더 (홈 화면 전용) ─── */
      .app-header.header.card {
        background: var(--c-surface);
        border: 1px solid var(--c-border);
        border-radius: var(--r-lg);
        padding: 14px 20px;
        box-shadow: var(--sh-sm);
      }
      .app-header .header-top {
        display: flex; justify-content: space-between; align-items: center;
        gap: 16px;
      }
      .app-header h1 {
        margin: 0;
        font-size: 1.1rem; font-weight: 700;
        letter-spacing: -0.02em;
        display: flex; align-items: center; gap: 10px;
      }
      .app-header h1::before {
        content: '';
        width: 28px; height: 28px;
        border-radius: 0;
        background-color: #0a1228;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M3 12h4l3-9 4 18 3-9h4'/></svg>");
        background-repeat: no-repeat;
        background-position: center;
        background-size: 18px 18px;
        box-shadow: 0 3px 10px -2px rgba(10, 18, 40, 0.40);
      }
      .app-header h1 .brand-name {
        background: none;
        -webkit-background-clip: initial; background-clip: initial;
        -webkit-text-fill-color: #000000;
        color: #000000;
      }
      .app-header .criteria-btn {
        background: var(--c-surface) !important;
        color: var(--c-text-secondary) !important;
        border: 1px solid var(--c-border) !important;
        border-radius: var(--r-md);
        padding: 7px 12px;
        font-size: 0.82rem; font-weight: 500;
        transition: all var(--tr);
        font-family: inherit;
        letter-spacing: 0.005em;
      }
      .app-header .criteria-btn:hover {
        background: var(--c-surface-soft) !important;
        border-color: var(--c-rose) !important;
        color: var(--c-rose) !important;
      }

      /* ─── 홈 패널 (모듈 카드) ─── */
      #home-panel.home-panel.card {
        background: transparent;
        border: 0;
        padding: 0;
        box-shadow: none;
        display: grid;
        gap: 14px;
      }

      /* ─── 모듈 카드 (.home-module-btn 재정의) ─── */
      .home-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px !important;
      }
      .home-module-btn {
        position: relative;
        background: #ffffff;
        border: 1px solid var(--c-border);
        border-radius: var(--r-lg);
        padding: 22px 22px 20px !important;
        min-height: auto !important;
        text-align: left;
        cursor: pointer;
        transition: all var(--tr);
        display: flex !important;
        flex-direction: column;
        gap: 10px;
        font-family: var(--font-sans) !important;
        color: var(--c-text) !important;
        box-shadow: var(--sh-sm);
        overflow: hidden;
        text-decoration: none;
        -webkit-appearance: none;
      }
      a.home-module-btn, a.home-module-btn:visited { color: var(--c-text) !important; text-decoration: none; }
      a.home-module-btn:focus-visible { outline: 3px solid rgba(10, 18, 40, 0.30); outline-offset: 2px; }
      .home-module-btn::before {
        content: ''; position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: #0a1228;
        opacity: 0;
        transition: opacity var(--tr);
      }
      .home-module-btn::after {
        content: '→';
        position: absolute;
        top: 22px; right: 22px;
        font-size: 1rem; line-height: 1;
        color: var(--c-muted);
        transition: all var(--tr);
      }
      .home-module-btn:hover {
        border-color: #0a1228;
        transform: translateY(-2px);
        box-shadow: var(--sh-xl), var(--sh-glow);
      }
      .home-module-btn:hover::before { opacity: 1; }
      .home-module-btn:hover::after { color: #0a1228; transform: translateX(4px); }
      .home-module-btn:active { transform: translateY(-1px); }

      .home-module-btn .module-chip {
        display: inline-flex; align-items: center; gap: 6px;
        align-self: flex-start;
        font-size: 0.68rem !important; font-weight: 700;
        letter-spacing: 0.04em;
        color: #ffffff !important;
        background: #0a1228;
        padding: 4px 10px;
        border-radius: 0;
        text-transform: uppercase;
        line-height: 1.2 !important;
        margin: 0 !important;
      }
      .home-module-btn .module-chip::before {
        content: ''; width: 6px; height: 6px;
        border-radius: 0;
        background: #ffffff;
        box-shadow: none;
      }
      .home-module-btn strong {
        font-size: 1.05rem !important;
        font-weight: 700;
        letter-spacing: -0.015em;
        color: var(--c-text);
        line-height: 1.3;
        padding-right: 28px;
      }
      .home-module-btn span {
        font-size: 0.85rem !important;
        line-height: 1.55 !important;
        color: var(--c-text-secondary) !important;
        margin-top: 2px;
      }
      /* ─── 모듈 진입 후엔 상단 헤더 카드 숨김 ─── */
      .app-shell:not(.home-mode) .app-header { display: none; }

    </style>
  </head>
  <body>
    <main class="page app-shell home-mode">
      <div class="main-pane">
        <header class="header card app-header">
          <div class="header-top">
            <h1><span class="brand-name">FNCADnet</span></h1>
            <div class="header-actions">
              <a href="{{ url_for('logout') }}" class="criteria-btn"
                 title="End current session and return to the login screen"
                 style="text-decoration: none;"
                 onclick="return confirm('Sign out?\nYou will need to enter the password again.');">
                Sign out
              </a>
            </div>
          </div>
        </header>

        <section id="home-panel" class="card home-panel">
          <div class="home-grid">
            <a class="home-module-btn" href="{{ url_for('remote30_workbench') }}">
              <span class="module-chip">모듈 C</span>
              <strong>건축도면(DXF) 레이어 정리</strong>
              <span>DXF 를 올려 화면에서 바로 레이어 표시를 켜고 끄고, 배관 · 헤드 · 문자 · 건축으로 다시 분류합니다. 정리한 도면은 DXF 또는 DWG 로 다시 내보냅니다.</span>
            </a>
            <a class="home-module-btn" href="{{ url_for('module_d_output_page') }}">
              <span class="module-chip">모듈 D</span>
              <strong>출력 워크벤치 (역방향)</strong>
              <span>PIPENET 산출물(.sdf / .xml)을 올리면 PIPENET 을 돌리지 않고 계통도 PDF 와 수리계산서 PDF 를 그립니다. 표시할 항목을 바꾸면 재계산 없이 곧바로 다시 그립니다.</span>
            </a>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
