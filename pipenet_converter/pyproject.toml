[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipenet-converter"
version = "0.1.0"
description = "Convert fire protection sprinkler CAD-derived data into PipeNet-compatible SDF files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas",
  "networkx",
  "matplotlib",
  "lxml",
  "ezdxf",
  "typer",
  "PyYAML",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
]

[project.scripts]
pipenet-converter = "pipenet_converter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
