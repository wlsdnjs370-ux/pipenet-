<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>건축 레이어 정리</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --panel: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #d1d5db;
      --accent: #111827;
      --cat-pipe: #1d4ed8;
      --cat-head: #b91c1c;
      --cat-text: #166534;
      --cat-arch: #9ca3af;
      --cat-exclude: #6b7280;
      --cat-other: #92400e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: "Malgun Gothic", "Segoe UI", sans-serif; color: var(--text); background: var(--bg); }
    .workbench { display: grid; grid-template-columns: 1fr 380px; height: 100vh; }
    .canvas-pane { position: relative; background: #0f172a; overflow: hidden; }
    .canvas-pane canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    .canvas-pane canvas.is-panning { cursor: grabbing; }
    .canvas-overlay { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none; gap: 10px; flex-wrap: wrap; }
    .canvas-overlay .pill { background: rgba(15, 23, 42, 0.85); color: #e5e7eb; border: 1px solid #334155; padding: 6px 10px; font-size: 0.8rem; pointer-events: auto; font-family: ui-monospace, monospace; }
    .canvas-overlay button { pointer-events: auto; background: #1f2937; color: #e5e7eb; border: 1px solid #475569; padding: 6px 10px; font-size: 0.78rem; cursor: pointer; }
    .canvas-overlay button:hover { background: #334155; }
    .canvas-toolbar { position: absolute; bottom: 12px; left: 12px; display: flex; gap: 6px; pointer-events: none; }
    .canvas-toolbar button { pointer-events: auto; background: rgba(15, 23, 42, 0.85); color: #e5e7eb; border: 1px solid #475569; padding: 7px 12px; font-size: 0.78rem; cursor: pointer; font-weight: 600; }
    .canvas-toolbar button.active { background: #2563eb; border-color: #2563eb; }
    .zoom-group { display: inline-flex; align-items: stretch; margin-left: 8px; border: 1px solid #475569; background: rgba(15, 23, 42, 0.85); pointer-events: auto; }
    .zoom-group button { background: transparent; color: #e5e7eb; border: none; padding: 7px 12px; font-size: 1.05rem; font-weight: 700; cursor: pointer; min-width: 32px; }
    .zoom-group button:hover { background: #1e40af; color: #fff; }
    .zoom-group button:active { background: #1d4ed8; }
    .zoom-group .zoom-level { display: inline-flex; align-items: center; justify-content: center; min-width: 56px; padding: 0 6px; color: #cbd5e1; font-size: 0.78rem; font-family: ui-monospace, monospace; border-left: 1px solid #475569; border-right: 1px solid #475569; cursor: pointer; user-select: none; }
    .zoom-group .zoom-level:hover { background: #1e293b; color: #fff; }
    .canvas-empty { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #94a3b8; font-size: 0.9rem; text-align: center; }
    .canvas-empty strong { display: block; font-size: 1.1rem; margin-bottom: 6px; color: #cbd5e1; }
    .sidebar { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; }
    .sidebar h2 { margin: 0; padding: 14px 16px; font-size: 1rem; font-weight: 700; border-bottom: 1px solid var(--line); background: #f9fafb; position: sticky; top: 0; z-index: 2; }
    .sidebar section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .sidebar section h3 { margin: 0 0 8px; font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .sidebar .field { display: grid; gap: 4px; margin-bottom: 8px; }
    .sidebar .field label { font-size: 0.78rem; font-weight: 600; color: var(--text); }
    .sidebar .field input { width: 100%; padding: 6px 8px; border: 1px solid var(--line); background: #fff; font-size: 0.85rem; font-family: inherit; border-radius: 0; }
    .sidebar .field input:focus { outline: 1px solid var(--accent); }
    .layer-list { max-height: 60vh; overflow-y: auto; border: 1px solid var(--line); }
    .layer-row { display: grid; grid-template-columns: auto 1fr 90px; gap: 6px; padding: 6px 8px; border-bottom: 1px solid #f3f4f6; align-items: center; font-size: 0.78rem; }
    .layer-row:hover { background: #fafbfc; }
    .layer-row input[type="checkbox"] { margin: 0; }
    .layer-row .name { font-family: ui-monospace, monospace; font-size: 0.74rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .layer-row .count { font-size: 0.7rem; color: var(--muted); }
    .layer-row select { padding: 3px 4px; font-size: 0.72rem; border: 1px solid var(--line); border-radius: 0; }
    .layer-row .cat-PIPE { color: var(--cat-pipe); font-weight: 700; }
    .layer-row .cat-HEAD { color: var(--cat-head); font-weight: 700; }
    .layer-row .cat-TEXT { color: var(--cat-text); font-weight: 700; }
    .layer-row .cat-ARCH { color: var(--cat-arch); }
    .layer-row .cat-EXCLUDE { color: var(--cat-exclude); text-decoration: line-through; }
    .layer-row .cat-OTHER { color: var(--cat-other); }
    .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.72rem; margin: 6px 0; }
    .legend span { display: inline-flex; align-items: center; gap: 4px; }
    .legend .dot { display: inline-block; width: 10px; height: 10px; border: 1px solid #334155; }
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; background: var(--accent); color: #fff; font-size: 0.85rem; }
    .topbar a { color: #cbd5e1; text-decoration: none; font-size: 0.78rem; }
    .topbar a:hover { color: #fff; text-decoration: underline; }
    @media (max-width: 900px) {
      .workbench { grid-template-columns: 1fr; grid-template-rows: 60vh 1fr; }
      .sidebar { border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <strong>건축 레이어 정리</strong>
    <a href="/" target="_top">← 홈으로</a>
  </div>
  <div class="workbench">
    <div class="canvas-pane">
      <canvas id="wb-canvas"></canvas>
      <div id="wb-empty" class="canvas-empty">
        <strong>DXF 파일을 업로드하세요</strong>
        오른쪽 사이드 패널에서 .dxf 파일을 선택하면<br>여기에 도면이 표시됩니다.
      </div>
      <div class="canvas-overlay">
        <span id="wb-overlay-info" class="pill">대기 중</span>
        <div style="display:flex; gap:6px; align-items:center;">
          <span id="wb-overlay-cursor" class="pill" style="display:none;"></span>
          <button id="wb-fit-btn" type="button">화면 맞춤</button>
          <button id="wb-reset-classify" type="button">분류 초기화</button>
        </div>
      </div>
      <div class="canvas-toolbar">
        <button id="wb-mode-pan" class="active" type="button">팬/줌</button>
        <div class="zoom-group">
          <button id="wb-zoom-out" type="button" title="축소 (또는 - 키)">−</button>
          <span id="wb-zoom-level" class="zoom-level" title="현재 줌">100%</span>
          <button id="wb-zoom-in" type="button" title="확대 (또는 + 키)">+</button>
        </div>
      </div>
    </div>

    <aside class="sidebar">
      <h2>DXF 레이어 정리</h2>

      <section>
        <h3>1. DXF 파일</h3>
        <div class="field">
          <label for="wb-dxf">DXF 업로드 (.dxf)</label>
          <input id="wb-dxf" type="file" accept=".dxf">
        </div>
        <p id="wb-load-status" style="margin:4px 0 0; font-size:0.78rem; color: var(--muted);">파일을 선택하세요.</p>
      </section>

      <section>
        <h3>2. 레이어 분류</h3>
        <div class="legend">
          <span><i class="dot" style="background:#3b82f6"></i>PIPE</span>
          <span><i class="dot" style="background:#ef4444"></i>HEAD</span>
          <span><i class="dot" style="background:#22c55e"></i>TEXT</span>
          <span><i class="dot" style="background:#94a3b8"></i>ARCH</span>
          <span><i class="dot" style="background:#71717a"></i>EXCLUDE</span>
          <span><i class="dot" style="background:#f59e0b"></i>OTHER</span>
        </div>
        <div id="wb-layer-list" class="layer-list">
          <div style="padding:14px; text-align:center; color:var(--muted); font-size:0.82rem;">DXF 업로드 후 표시됩니다.</div>
        </div>
        <p style="margin:6px 0 0; font-size:0.72rem; color: var(--muted);">체크 = 캔버스 표시. 카테고리 변경 시 색상 분류가 바뀝니다.</p>
      </section>

      <section>
        <h3>3. CAD 재출력</h3>
        <p style="margin:0 0 8px; font-size:0.76rem; color:var(--muted);">체크로 남긴 레이어만 담아 정리된 도면으로 다시 내려받습니다.</p>
        <div class="field">
          <label for="wb-export-fmt">출력 형식</label>
          <select id="wb-export-fmt" style="width:100%; padding:6px 8px; border:1px solid var(--line); font-size:0.85rem; font-family:inherit;">
            <option value="dxf" selected>DXF (.dxf)</option>
            <option value="dwg">DWG (.dwg) — ODA File Converter 필요</option>
          </select>
        </div>
        <button id="wb-export-btn" type="button" disabled style="width:100%; padding:9px; background:var(--accent); color:#fff; border:1px solid var(--accent); font-weight:700; cursor:pointer; font-size:0.9rem;">정리된 도면 다운로드</button>
        <p id="wb-export-status" style="margin:6px 0 0; font-size:0.76rem; color:var(--muted);">DXF 업로드 후 사용 가능합니다.</p>
      </section>
    </aside>
  </div>

  <script>
    // 레이어명은 업로드된 DXF 에서 온다 — 속성 보간 탈출을 막으려면 따옴표까지 5자 전부.
    function escHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    // ====== 상태 ======
    const CATEGORY_COLORS = {
      PIPE:    "#3b82f6",
      HEAD:    "#ef4444",
      TEXT:    "#22c55e",
      ARCH:    "#94a3b8",
      EXCLUDE: "#71717a",
      OTHER:   "#f59e0b",
    };
    const state = {
      entities: [],
      bbox: null,
      layers: [],
      layerState: {},
      view: { zoom: 1, panX: 0, panY: 0 },
      dpr: window.devicePixelRatio || 1,
      dxfFile: null,
      dxfToken: null,
      drag: null,
      fitZoom: null,
    };

    const canvas = document.getElementById("wb-canvas");
    const ctx = canvas.getContext("2d", { alpha: false });
    const emptyEl = document.getElementById("wb-empty");
    const overlayInfoEl = document.getElementById("wb-overlay-info");
    const overlayCursorEl = document.getElementById("wb-overlay-cursor");
    const dxfInputEl = document.getElementById("wb-dxf");
    const loadStatusEl = document.getElementById("wb-load-status");
    const layerListEl = document.getElementById("wb-layer-list");
    const fitBtnEl = document.getElementById("wb-fit-btn");
    const resetBtnEl = document.getElementById("wb-reset-classify");
    const zoomInBtn = document.getElementById("wb-zoom-in");
    const zoomOutBtn = document.getElementById("wb-zoom-out");
    const zoomLevelEl = document.getElementById("wb-zoom-level");
    const exportBtnEl = document.getElementById("wb-export-btn");
    const exportFmtEl = document.getElementById("wb-export-fmt");
    const exportStatusEl = document.getElementById("wb-export-status");

    // ====== Canvas 리사이즈 ======
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      state.dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(rect.width * state.dpr);
      canvas.height = Math.round(rect.height * state.dpr);
      render();
    }
    window.addEventListener("resize", resizeCanvas);

    // ====== 뷰 변환 ======
    function fitToBBox() {
      if (!state.bbox) return;
      const rect = canvas.getBoundingClientRect();
      const w = rect.width, h = rect.height;
      const bw = state.bbox.x_max - state.bbox.x_min;
      const bh = state.bbox.y_max - state.bbox.y_min;
      if (bw <= 0 || bh <= 0) return;
      const margin = 30;
      const zx = (w - 2 * margin) / bw;
      const zy = (h - 2 * margin) / bh;
      const z = Math.min(zx, zy);
      state.view.zoom = z;
      // DXF 좌표계: Y가 위쪽. Canvas 는 Y가 아래쪽. -z 로 뒤집기.
      state.view.panX = w / 2 - ((state.bbox.x_min + state.bbox.x_max) / 2) * z;
      state.view.panY = h / 2 + ((state.bbox.y_min + state.bbox.y_max) / 2) * z;
      state.fitZoom = z;
      render();
      updateZoomLevelDisplay();
    }
    fitBtnEl.addEventListener("click", fitToBBox);

    function zoomAtPoint(sx, sy, factor) {
      if (!state.entities.length) return;
      const [wx, wy] = screenToWorld(sx, sy);
      state.view.zoom *= factor;
      const [nsx, nsy] = worldToScreen(wx, wy);
      state.view.panX += sx - nsx;
      state.view.panY += sy - nsy;
      render();
      updateZoomLevelDisplay();
    }

    function zoomCenter(factor) {
      const rect = canvas.getBoundingClientRect();
      zoomAtPoint(rect.width / 2, rect.height / 2, factor);
    }

    function updateZoomLevelDisplay() {
      if (!zoomLevelEl) return;
      const ratio = state.fitZoom ? (state.view.zoom / state.fitZoom) : state.view.zoom;
      zoomLevelEl.textContent = (ratio * 100).toFixed(0) + "%";
    }

    zoomInBtn.addEventListener("click", () => zoomCenter(1.25));
    zoomOutBtn.addEventListener("click", () => zoomCenter(1 / 1.25));
    zoomLevelEl.addEventListener("click", fitToBBox);

    // 키보드 단축키: + 확대 / - 축소 / 0 화면 맞춤
    window.addEventListener("keydown", (e) => {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA" || e.target.isContentEditable)) return;
      if (e.key === "+" || e.key === "=") { e.preventDefault(); zoomCenter(1.25); }
      else if (e.key === "-" || e.key === "_") { e.preventDefault(); zoomCenter(1 / 1.25); }
      else if (e.key === "0") { e.preventDefault(); fitToBBox(); }
    });

    function worldToScreen(x, y) {
      return [x * state.view.zoom + state.view.panX, -y * state.view.zoom + state.view.panY];
    }
    function screenToWorld(sx, sy) {
      return [(sx - state.view.panX) / state.view.zoom, -(sy - state.view.panY) / state.view.zoom];
    }

    // ====== 렌더링 ======
    function render() {
      const w = canvas.width / state.dpr;
      const h = canvas.height / state.dpr;
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, w, h);
      if (!state.entities.length) return;

      ctx.lineWidth = 1;

      // 카테고리별 그룹 렌더 (TEXT/HEAD 는 마지막에)
      const groups = { ARCH: [], EXCLUDE: [], OTHER: [], PIPE: [], HEAD: [], TEXT: [] };
      for (const ent of state.entities) {
        const ls = state.layerState[ent.l];
        if (!ls || !ls.visible) continue;
        const cat = ls.category;
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(ent);
      }
      const order = ["EXCLUDE", "ARCH", "OTHER", "TEXT", "PIPE", "HEAD"];
      for (const cat of order) {
        const arr = groups[cat] || [];
        if (!arr.length) continue;
        const color = CATEGORY_COLORS[cat];
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.globalAlpha = (cat === "ARCH" || cat === "EXCLUDE") ? 0.35 : 1.0;
        ctx.lineWidth = (cat === "PIPE" || cat === "HEAD") ? 1.6 : 0.9;
        for (const ent of arr) drawEntity(ent);
      }
      ctx.globalAlpha = 1;
    }

    function signedArea2(pts) {
      let s = 0;
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        s += a[0] * b[1] - b[0] * a[1];
      }
      return s;
    }

    function tracePoly(pts) {
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        const [sx, sy] = worldToScreen(pts[i][0], pts[i][1]);
        if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      }
    }

    function drawEntity(ent) {
      const z = state.view.zoom;
      if (ent.t === "L") {
        const [a, b] = worldToScreen(ent.p[0], ent.p[1]);
        const [c, d] = worldToScreen(ent.p[2], ent.p[3]);
        ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke();
      } else if (ent.t === "PL") {
        tracePoly(ent.p);
        ctx.stroke();
      } else if (ent.t === "A") {
        const [sx, sy] = worldToScreen(ent.c[0], ent.c[1]);
        const r = ent.r * z;
        if (r < 0.3) return;
        // DXF ARC 는 CCW. Canvas 는 CW 가 양수.
        const sa = ent.a[0] * Math.PI / 180;
        const ea = ent.a[1] * Math.PI / 180;
        ctx.beginPath();
        ctx.arc(sx, sy, r, -ea, -sa, false);
        ctx.stroke();
      } else if (ent.t === "C") {
        const [sx, sy] = worldToScreen(ent.c[0], ent.c[1]);
        const r = ent.r * z;
        if (r < 0.5) {
          ctx.fillRect(sx - 1, sy - 1, 2, 2);
          return;
        }
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.stroke();
      } else if (ent.t === "H") {
        if (!ent.p || ent.p.length < 3) return;
        tracePoly(ent.p);
        ctx.closePath();
        const prev = ctx.globalAlpha;
        ctx.globalAlpha = prev * 0.25;
        ctx.fill();
        ctx.globalAlpha = prev;
        ctx.stroke();
      } else if (ent.t === "S") {
        if (!ent.p || ent.p.length < 3) return;
        // DXF SOLID/TRACE 는 정점을 0-1-3-2 나비 순서로 저장하고 3DFACE 는 0-1-2-3 이다.
        // 서버가 셋을 같은 "S" 로 방출해 구분이 없으므로, 자기교차하지 않는 순서
        // (= 부호면적 절댓값이 큰 쪽)를 실제 외곽으로 본다. 틀리면 기둥이 모래시계가 된다.
        let pts = ent.p;
        if (pts.length === 4) {
          const alt = [pts[0], pts[1], pts[3], pts[2]];
          if (Math.abs(signedArea2(pts)) < Math.abs(signedArea2(alt))) pts = alt;
        }
        tracePoly(pts);
        ctx.closePath();
        ctx.fill();
      } else if (ent.t === "I") {
        const [sx, sy] = worldToScreen(ent.p[0], ent.p[1]);
        ctx.beginPath();
        ctx.moveTo(sx, sy - 3); ctx.lineTo(sx + 3, sy); ctx.lineTo(sx, sy + 3); ctx.lineTo(sx - 3, sy);
        ctx.closePath();
        ctx.fill();
      } else if (ent.t === "T") {
        if (z < 0.005) return;
        const [sx, sy] = worldToScreen(ent.p[0], ent.p[1]);
        ctx.font = "10px ui-monospace, monospace";
        ctx.fillText(ent.v, sx, sy);
      }
    }

    // ====== 인터랙션: zoom + pan ======
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      zoomAtPoint(mx, my, factor);
    }, { passive: false });

    canvas.addEventListener("mousedown", (e) => {
      state.drag = { x: e.clientX, y: e.clientY, panX: state.view.panX, panY: state.view.panY };
      canvas.classList.add("is-panning");
    });

    window.addEventListener("mouseup", () => {
      state.drag = null;
      canvas.classList.remove("is-panning");
    });

    window.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      const inside = e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom;
      if (state.drag) {
        state.view.panX = state.drag.panX + (e.clientX - state.drag.x);
        state.view.panY = state.drag.panY + (e.clientY - state.drag.y);
        render();
        return;
      }
      if (state.entities.length && inside) {
        const [wx, wy] = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
        overlayCursorEl.style.display = "inline-block";
        overlayCursorEl.textContent = `( ${wx.toFixed(0)} , ${wy.toFixed(0)} )`;
      } else {
        overlayCursorEl.style.display = "none";
      }
    });

    // ====== DXF 업로드 + inspect ======
    dxfInputEl.addEventListener("change", async () => {
      const file = dxfInputEl.files[0];
      if (!file) return;
      state.dxfFile = file;
      loadStatusEl.textContent = `업로드 중... (${(file.size / 1024 / 1024).toFixed(1)} MB)`;

      const fd = new FormData();
      fd.append("dxf_file", file);
      try {
        const res = await fetch("/api/remote30/inspect", { method: "POST", body: fd });
        if (!res.ok) {
          let msg = `HTTP ${res.status}`;
          try { const j = await res.json(); if (j && j.message) msg = j.message; } catch (_) {}
          throw new Error(msg);
        }
        // /api/remote30/inspect 는 NDJSON 스트림을 반환한다:
        //   {"type":"progress","entities":[...]}  (다중, 점진 렌더용)
        //   {"type":"result","ok":true,"bbox":..,"layers":..,"dxf_token":..,"counts":..}  (최종 1개)
        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buf = "";
        const entities = [];
        let result = null;
        const handleLine = (line) => {
          const s = line.trim();
          if (!s) return;
          let msg;
          try { msg = JSON.parse(s); } catch (_) { return; }
          if (msg.type === "progress") {
            if (Array.isArray(msg.entities)) {
              for (const e of msg.entities) entities.push(e);
            }
            if (msg.bbox) {
              state.entities = entities;
              state.bbox = msg.bbox;
              loadStatusEl.textContent = `로딩 중... entity ${entities.length.toLocaleString()}`;
              fitToBBox();
            }
          } else if (msg.type === "result") {
            result = msg;
          } else if (msg.ok === false) {
            throw new Error(msg.message || "DXF 분석 실패");
          }
        };
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let nl;
          while ((nl = buf.indexOf("\n")) >= 0) {
            handleLine(buf.slice(0, nl));
            buf = buf.slice(nl + 1);
          }
        }
        if (buf.trim()) handleLine(buf);  // 마지막 줄(개행 없을 수 있음)
        if (!result) throw new Error("스트림에 result 메시지가 없습니다");
        if (result.ok === false) throw new Error(result.message || "DXF 분석 실패");

        state.entities = entities;
        state.bbox = result.bbox;
        state.layers = result.layers || [];
        state.dxfToken = result.dxf_token;
        state.layerState = {};
        for (const layer of state.layers) {
          state.layerState[layer.name] = {
            visible: layer.auto_category !== "EXCLUDE",
            category: layer.auto_category,
          };
        }
        const totalEnt = (result.counts && result.counts.total_entities) != null
          ? result.counts.total_entities : entities.length;
        const layerN = (result.counts && result.counts.layers) != null
          ? result.counts.layers : state.layers.length;
        loadStatusEl.textContent = `${result.dxf_filename} — entity ${totalEnt}, layer ${layerN}`;
        overlayInfoEl.textContent = `${totalEnt} entities | ${layerN} layers`;
        emptyEl.style.display = "none";
        renderLayerList();
        fitToBBox();
        exportBtnEl.disabled = false;
        exportStatusEl.textContent = "체크한 레이어를 CAD 로 재출력할 수 있습니다.";
      } catch (err) {
        loadStatusEl.textContent = "오류: " + err.message;
      }
    });

    // ====== 레이어 목록 렌더 ======
    function renderLayerList() {
      if (!state.layers.length) return;
      const cats = ["PIPE", "HEAD", "TEXT", "ARCH", "EXCLUDE", "OTHER"];
      const rows = state.layers.map((l) => {
        const ls = state.layerState[l.name];
        const opts = cats.map((c) => `<option value="${c}" ${ls.category === c ? "selected" : ""}>${c}</option>`).join("");
        const safeName = escHtml(l.name);
        return `<div class="layer-row">
          <input type="checkbox" data-layer="${encodeURIComponent(l.name)}" ${ls.visible ? "checked" : ""}>
          <div>
            <div class="name cat-${ls.category}" title="${safeName}">${safeName}</div>
            <div class="count">${l.count.toLocaleString()} ent.</div>
          </div>
          <select data-layer-cat="${encodeURIComponent(l.name)}">${opts}</select>
        </div>`;
      }).join("");
      layerListEl.innerHTML = rows;

      layerListEl.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
        cb.addEventListener("change", () => {
          const name = decodeURIComponent(cb.dataset.layer);
          state.layerState[name].visible = cb.checked;
          render();
        });
      });
      layerListEl.querySelectorAll("select").forEach((sel) => {
        sel.addEventListener("change", () => {
          const name = decodeURIComponent(sel.dataset.layerCat);
          state.layerState[name].category = sel.value;
          const row = sel.closest(".layer-row");
          const nameEl = row.querySelector(".name");
          nameEl.className = "name cat-" + sel.value;
          render();
        });
      });
    }

    resetBtnEl.addEventListener("click", () => {
      for (const l of state.layers) {
        state.layerState[l.name] = { visible: l.auto_category !== "EXCLUDE", category: l.auto_category };
      }
      renderLayerList();
      render();
    });

    // ====== CAD 재출력 (체크한 레이어만) ======
    exportBtnEl.addEventListener("click", async () => {
      if (!state.dxfToken && !state.dxfFile) {
        exportStatusEl.innerHTML = "<span style='color:#b91c1c'>먼저 DXF 를 업로드하세요.</span>";
        return;
      }
      const visible = state.layers
        .filter((l) => state.layerState[l.name] && state.layerState[l.name].visible)
        .map((l) => l.name);
      if (!visible.length) {
        exportStatusEl.innerHTML = "<span style='color:#b91c1c'>남길 레이어가 없습니다. 하나 이상 체크하세요.</span>";
        return;
      }
      const fmt = exportFmtEl.value || "dxf";
      exportBtnEl.disabled = true;
      exportStatusEl.textContent = `${fmt.toUpperCase()} 생성 중... (${visible.length}개 레이어 유지)`;

      const fd = new FormData();
      if (state.dxfToken) fd.append("dxf_token", state.dxfToken);
      else if (state.dxfFile) fd.append("dxf_file", state.dxfFile);
      fd.append("visible_layers", JSON.stringify(visible));
      fd.append("format", fmt);

      try {
        const res = await fetch("/api/remote30/export_cad", { method: "POST", body: fd });
        if (!res.ok) {
          let msg = `HTTP ${res.status}`;
          try { const j = await res.json(); if (j && j.message) msg = j.message; } catch (_) {}
          throw new Error(msg);
        }
        const removed = res.headers.get("X-Removed-Entities");
        const blob = await res.blob();
        const cd = res.headers.get("Content-Disposition") || "";
        const m = cd.match(/filename\*?=(?:UTF-8''|")?([^\";]+)/i);
        const name = m ? decodeURIComponent(m[1].replace(/"$/, "")) : `cleaned.${fmt}`;
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        exportStatusEl.innerHTML = `완료 — <strong>${name}</strong> 다운로드`
          + (removed ? ` (제외된 객체 ${Number(removed).toLocaleString()}개)` : "");
      } catch (err) {
        exportStatusEl.innerHTML = "<span style='color:#b91c1c'>오류: " + err.message + "</span>";
      } finally {
        exportBtnEl.disabled = false;
      }
    });

    // 초기 렌더
    setTimeout(resizeCanvas, 50);
  </script>
</body>
</html>
