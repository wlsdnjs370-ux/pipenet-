; 시험이 «어디까지» 인지 못박는다.
;
; ★없을 때 무슨 일이 있었나 (2026-09-03 실측)
;   뿌리에서 그냥 `pytest` 를 치면 484건을 모으고 11건이 수집 실패로 터졌다.
;   그런데 그 484건에는 **우리 시험 1,608건이 한 건도 없었다** — 동봉된 남의
;   솔버(K-Fire_Solver/_internal/wntr)의 자체 시험과 pipenet_converter 만
;   긁다 끝났다. 「초록불」 을 보고 우리 것이 돌았다고 믿을 수 있는 상태였다.
;   시험이 안 도는 것보다, 안 돈 줄 모르는 것이 나쁘다.
;
;   수집 실패 11건의 정체도 여기서 갈린다:
;     · 2건 — 동봉 솔버(PyInstaller 번들)의 시험. 우리 코드가 아니다.
;     · 1건 — data/ 의 일회용 탐침.
;     · 8건 — 은퇴한 E 트리와 현역 G 트리를 **한 판에 같이** 긁어서 난 것.
;       두 트리는 `services`/`domain` 패키지 이름이 같아 한 프로세스에 둘 다
;       올리면 어느 쪽이 import 되는지가 순서 우연에 걸린다
;       (routes/module_f/common.py 의 F-0·D1 이 같은 이유로 sys.path 를 G
;        하나로 고정한다). 애초에 같이 올리지 않는 것이 답이다.
[pytest]
testpaths = tests pipenet_converter/tests

; testpaths 밖을 명시적으로 짚어도(`pytest .`) 들어가지 말아야 할 곳.
norecursedirs =
    K-Fire_Solver
    cad_project_editor
    data
    .git
    node_modules
    build
    dist
    *.egg-info
